<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"name","type":"string","label":"Name","default":"Ashwil Bhupesh"},
    {"id":"gold","type":"color","label":"Accent","default":"#C9A86A"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ink: #f2ede4; --gold: #c9a86a; --night: #0c0c0e; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0c0e; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: #0c0c0e; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 46%; }
      #punch { position: absolute; inset: 0; transform-origin: 50% 46%; }
      #talk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cam-edge { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(201,168,106,0.0); }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="64" data-width="1080" data-height="1920" data-fps="30" data-motion-blur="on">
      <div id="ground"></div>

      <!-- Talking head. #cam carries the left/right shifts, #punch the punch-ins. -->
      <div id="cam" style="z-index: 1">
        <div id="punch">
          <video id="talk" class="clip" src="assets/talk.mp4" data-start="0" data-duration="61.5" data-track-index="0" playsinline data-has-audio="true" data-volume="1"></video>
        </div>
      </div>

      <!-- Typography over the speaker -->
      <div id="hook" class="scene" style="z-index: 4" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="difficult" class="scene" style="z-index: 4" data-composition-id="difficult" data-composition-src="compositions/difficult.html" data-start="7.5" data-duration="3.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="top1" class="scene" style="z-index: 4" data-composition-id="top1" data-composition-src="compositions/top1.html" data-start="26.9" data-duration="2.85" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="mission" class="scene" style="z-index: 4" data-composition-id="mission" data-composition-src="compositions/mission.html" data-start="29.75" data-duration="3.85" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="pillars" class="scene" style="z-index: 4" data-composition-id="pillars" data-composition-src="compositions/pillars.html" data-start="50.35" data-duration="2.75" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Panels that push in from the sides -->
      <div id="crore" class="scene" style="z-index: 6" data-composition-id="crore" data-composition-src="compositions/crore.html" data-start="3.3" data-duration="4.45" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="grades" class="scene" style="z-index: 6" data-composition-id="grades" data-composition-src="compositions/grades.html" data-start="12.3" data-duration="5.2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="iit" class="scene" style="z-index: 7" data-composition-id="iit" data-composition-src="compositions/iit.html" data-start="16.85" data-duration="4.1" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="civil" class="scene" style="z-index: 6" data-composition-id="civil" data-composition-src="compositions/civil.html" data-start="20.3" data-duration="6.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="realty" class="scene" style="z-index: 6" data-composition-id="realty" data-composition-src="compositions/realty.html" data-start="33.65" data-duration="6.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="vision" class="scene" style="z-index: 7" data-composition-id="vision" data-composition-src="compositions/vision.html" data-start="39.8" data-duration="10.7" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="access" class="scene" style="z-index: 6" data-composition-id="access" data-composition-src="compositions/access.html" data-start="53.1" data-duration="8.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" class="scene" style="z-index: 9" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="61.05" data-duration="2.95" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Chapter markers -->
      <div id="chapters" class="scene" style="z-index: 8" data-composition-id="chapters" data-composition-src="compositions/chapters.html" data-start="0" data-duration="61" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Every caption group lives in this one host -->
      <div id="captions" class="scene" style="z-index: 10" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="61.5" data-track-index="5" data-track-kind="captions" data-width="1080" data-height="1920"></div>

      <!-- Music bed and restrained sound design -->
      <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="64" data-track-index="10" data-volume="0.9" data-fade-out="1.5"></audio>
      <audio id="sfx-push-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.25" data-duration="0.57" data-track-index="11" data-volume="0.28"></audio>
      <audio id="sfx-push-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.05" data-duration="0.57" data-track-index="12" data-volume="0.22"></audio>
      <audio id="sfx-push-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="12.25" data-duration="0.57" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-push-4" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="16.8" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-push-5" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="20.25" data-duration="0.57" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-push-6" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="26.4" data-duration="0.57" data-track-index="12" data-volume="0.2"></audio>
      <audio id="sfx-push-7" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="33.6" data-duration="0.57" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-push-8" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="39.75" data-duration="0.57" data-track-index="12" data-volume="0.28"></audio>
      <audio id="sfx-push-9" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="44.2" data-duration="0.57" data-track-index="11" data-volume="0.2"></audio>
      <audio id="sfx-push-10" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="49.8" data-duration="0.57" data-track-index="12" data-volume="0.2"></audio>
      <audio id="sfx-push-11" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="53.05" data-duration="0.57" data-track-index="11" data-volume="0.22"></audio>
      <audio id="sfx-push-12" class="clip" src="assets/sfx/whoosh.mp3" data-start="61.0" data-duration="0.57" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-stat-1" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.95" data-duration="0.36" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-stat-2" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.9" data-duration="0.36" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-stat-3" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.15" data-duration="0.36" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-stat-4" class="clip" src="assets/sfx/ping.mp3" data-start="19.7" data-duration="1.2" data-track-index="14" data-volume="0.16" data-fade-out="0.4"></audio>
      <audio id="sfx-stat-5" class="clip" src="assets/sfx/click-soft.mp3" data-start="24.3" data-duration="0.36" data-track-index="13" data-volume="0.5"></audio>
      <audio id="sfx-stat-6" class="clip" src="assets/sfx/ping.mp3" data-start="25.4" data-duration="1.2" data-track-index="14" data-volume="0.16" data-fade-out="0.4"></audio>
      <audio id="sfx-stat-7" class="clip" src="assets/sfx/ping.mp3" data-start="29.25" data-duration="1.2" data-track-index="14" data-volume="0.14" data-fade-out="0.4"></audio>
      <audio id="sfx-end" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="61.45" data-duration="2.1" data-track-index="13" data-volume="0.3" data-fade-out="1.0"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const cam = "#cam", punch = "#punch";
      const MOVE = { duration: 0.62, ease: "power3.inOut" };

      // 0.0 hook: hold a slightly tight frame, open up on the name
      tl.set(punch, { scale: 1.08 }, 0);
      tl.set(punch, { scale: 1.0 }, 0.88);
      // 3.30 push right-to-left into the population panel
      tl.fromTo(cam, { x: 0 }, { x: -1080, ...MOVE }, 3.3);
      // 7.10 carry on right-to-left back to the speaker
      tl.set(cam, { x: 1080 }, 7.1);
      tl.to(cam, { x: 0, ...MOVE }, 7.1);
      tl.set(punch, { scale: 1.1 }, 10.64);
      // 12.30 split: panel from the left, speaker shifts right
      tl.set(punch, { scale: 1.0 }, 12.3);
      tl.to(cam, { x: 300, ...MOVE }, 12.3);
      // 16.85 full push left-to-right into IIT Delhi
      tl.to(cam, { x: 1380, ...MOVE }, 16.85);
      // 20.30 everything travels right-to-left: speaker lands in the left strip
      tl.set(cam, { x: 1080 }, 20.3);
      tl.to(cam, { x: -300, ...MOVE }, 20.3);
      // 26.45 back to full frame, tight on "proven"
      tl.to(cam, { x: 0, ...MOVE }, 26.45);
      tl.set(punch, { scale: 1.1 }, 27.04);
      tl.set(punch, { scale: 1.0 }, 29.8);
      tl.set(punch, { scale: 1.08 }, 31.48);
      // 33.65 split: panel from the left
      tl.set(punch, { scale: 1.0 }, 33.65);
      tl.to(cam, { x: 300, ...MOVE }, 33.65);
      // 39.80 full push right-to-left into the vision
      tl.to(cam, { x: -1080, ...MOVE }, 39.8);
      // 44.25 the vision panel narrows to the right; speaker returns from the left
      tl.to(cam, { x: -300, ...MOVE }, 44.25);
      // 49.85 back to full frame for the three pillars
      tl.to(cam, { x: 0, ...MOVE }, 49.85);
      tl.set(punch, { scale: 1.08 }, 51.2);
      // 53.10 split: panel from the right
      tl.set(punch, { scale: 1.0 }, 53.1);
      tl.to(cam, { x: -300, ...MOVE }, 53.1);
      // 61.05 final push right-to-left into the name card
      tl.to(cam, { x: -1380, ...MOVE }, 61.05);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
